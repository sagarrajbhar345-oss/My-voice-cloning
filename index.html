<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Free AI Voice Cloning</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen flex items-center justify-center p-4">

  <div class="max-w-md w-full bg-slate-800 rounded-2xl p-6 shadow-2xl border border-slate-700">
    <h1 class="text-2xl font-bold mb-2 text-center text-indigo-400">AI Voice Generator</h1>
    <p class="text-slate-400 text-sm mb-6 text-center">Powered by Cartesia AI</p>

    <div class="mb-4">
      <label class="block text-sm font-medium mb-2">Apna Script Likhein:</label>
      <textarea id="textInput" rows="4" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-sm text-white focus:outline-none focus:border-indigo-500" placeholder="Yahan text likhein..."></textarea>
    </div>

    <button onclick="generateSpeech()" id="btn" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-semibold py-3 rounded-xl transition duration-200">
      Voice Generate Karein
    </button>

    <div class="mt-6 hidden" id="audioContainer">
      <p class="text-xs text-slate-400 mb-2">Generated Audio:</p>
      <audio id="audioPlayer" controls class="w-full"></audio>
    </div>
  </div>

  <script>
    async function generateSpeech() {
      const text = document.getElementById('textInput').value;
      const btn = document.getElementById('btn');
      const audioContainer = document.getElementById('audioContainer');
      const audioPlayer = document.getElementById('audioPlayer');

      if(!text) return alert("Kripya kuch text likhein!");

      btn.innerText = "Generating...";
      btn.disabled = true;

      try {
        const res = await fetch('/api/generate', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ text: text })
        });

        if(!res.ok) throw new Error("Voice generation failed");

        const blob = await res.blob();
        audioPlayer.src = URL.createObjectURL(blob);
        audioContainer.classList.remove('hidden');
        audioPlayer.play();
      } catch (err) {
        alert("Error: " + err.message);
      } finally {
        btn.innerText = "Voice Generate Karein";
        btn.disabled = false;
      }
    }
  </script>
</body>
</html>
